$version: 0.4.0
$learn_more: https://data-dict.tidyverse.org/

name: rlim_data_warehouse
label: "Red Line Impact Model (RLIM) Analytical Data Dictionary"
description: >-
  Data dictionary for the RLIM DuckDB warehouse covering Bronze raw cadastral ingestion,
  Silver spatial feature engineering, and Gold econometric modeling views for
  Mecklenburg County transit-oriented development and capitalization research.

tables:
  # =========================================================================
  # BRONZE LAYER (Raw Ingestion)
  # =========================================================================
  - name: bronze.parcels
    label: "Mecklenburg County Tax Parcels (Bronze)"
    description: "Raw cadastral parcel boundaries ingested from gis.charlottenc.gov CountyData MapServer."
    columns:
      - name: parcel_id
        type: string
        description: "Mecklenburg County Parcel Identification Number (PID)."
        examples: ["00101101", "00123456"]
      - name: nc_pin
        type: string
        description: "North Carolina permanent parcel identification number."
        examples: ["00101101", "00123457"]
      - name: raw_zoning
        type: string
        description: "Municipal zoning classification code from county cadastral records."
        examples: ["TOD-CC", "R-3", "UR-2", "B-1"]
      - name: shape_area_sqft
        type: number
        description: "Official cadastral surface area in square feet calculated by county GIS engine."
        examples: [19594.48, 34699.51]
      - name: calc_acreage
        type: number
        description: "Calculated parcel land area in acres (shape_area_sqft / 43,560)."
        examples: [0.4498, 0.7966]
      - name: geom
        type: string
        description: "Raw boundary geometry represented as WKT or internal spatial geometry (OGC:CRS84 / EPSG:4326)."
        examples: ["POLYGON ((-80.8431 35.4993, ...))"]
      - name: ingest_timestamp
        type: datetime
        description: "Timestamp when record entered the warehouse."
        range: ["2024-01-01T00:00:00Z", "2027-12-31T23:59:59Z"]

  - name: bronze.gtfs_stops
    label: "CATS Transit Platforms & Proposed Stations (Bronze)"
    description: "Station centroids aggregated from live CATS MapServer platform polygons and planned Red Line coordinates."
    columns:
      - name: stop_id
        type: string
        description: "Standard station code or planned identifier."
        examples: ["JWC", "RL_DAVIDSON", "RL_CORNELIUS"]
      - name: stop_name
        type: string
        description: "Public-facing transit platform or planned station name."
        examples: ["JW Clay Blvd Station", "Davidson Main & Griffith Station"]
      - name: stop_lat
        type: number
        description: "Latitude in WGS84 decimal degrees."
        range: [35.0, 35.6]
      - name: stop_lon
        type: number
        description: "Longitude in WGS84 decimal degrees."
        range: [-81.0, -80.6]
      - name: line_name
        type: string
        description: "Transit corridor or line designation."
        examples: ["BL", "BLE", "SL", "GL", "Red Line", "Control_Matthews"]
      - name: geom
        type: string
        description: "Centroid geometry point in OGC:CRS84 (Longitude, Latitude)."
        examples: ["POINT (-80.8431 35.4993)"]
      - name: is_planned
        type: boolean
        description: "Flag indicating whether the station is an active asset (FALSE) or proposed extension (TRUE)."
        examples: [false, true]
      - name: ingest_timestamp
        type: datetime
        description: "Timestamp when record was materialized into Bronze."
        range: ["2024-01-01T00:00:00Z", "2027-12-31T23:59:59Z"]

  - name: bronze.property_sales
    label: "Recorded Property Transactions (Bronze)"
    description: "Historical Mecklenburg County deed recordings and sales transactions."
    columns:
      - name: sale_id
        type: string
        description: "Unique deed or system transaction identifier."
        examples: ["SALE_00101101", "SALE_2024_001"]
      - name: parcel_id
        type: string
        description: "Foreign key referencing bronze.parcels.parcel_id."
        examples: ["00101101", "00123456"]
      - name: sale_date
        type: date
        description: "Closing or deed recording date."
        range: ["2000-01-01", "2026-12-31"]
      - name: sale_price
        type: number
        description: "Nominal transaction sales price in USD recorded on deed."
        examples: [450000.0, 550000.0]
      - name: qualified_sale_flag
        type: string
        description: "Flag indicating arm's-length market qualification."
        examples: ["Y", "N"]
      - name: deed_book
        type: string
        description: "Mecklenburg County Register of Deeds volume book index."
        examples: ["34500", "34521"]
      - name: deed_page
        type: string
        description: "Mecklenburg County Register of Deeds page index."
        examples: ["100", "102"]
      - name: ingest_timestamp
        type: datetime
        description: "Ingestion timestamp."
        range: ["2024-01-01T00:00:00Z", "2027-12-31T23:59:59Z"]

  # =========================================================================
  # SILVER LAYER (Feature Engineering & Standardization)
  # =========================================================================
  - name: silver.stations_spatial
    label: "Reprojected Transit Stations (Silver)"
    description: "CATS rail and proposed commuter platforms projected to North Carolina State Plane (EPSG:2264)."
    columns:
      - name: station_uid
        type: string
        description: "Composite unique key resolving multi-line station collisions (line_name || '_' || stop_id)."
        examples: ["Red Line_RL_DAVIDSON", "BLE_JWC"]
      - name: stop_id
        type: string
        description: "Base stop identifier."
        examples: ["RL_DAVIDSON", "JWC"]
      - name: stop_name
        type: string
        description: "Full transit platform name."
        examples: ["Davidson Main & Griffith Station", "JW Clay Blvd Station"]
      - name: line_name
        type: string
        description: "Corridor service name."
        examples: ["Red Line", "BLE", "BL", "Control_Matthews"]
      - name: is_planned
        type: boolean
        description: "Status flag (TRUE for future Red Line / Silver Line, FALSE for active rail)."
        examples: [true, false]
      - name: geom_2264
        type: string
        description: "Point geometry projected into NC State Plane (EPSG:2264, US Survey Feet)."
        examples: ["POINT (1449621.32 542686.55)"]

  - name: silver.parcels_spatial
    label: "Harmonized Parcel Hedonic & Spatial Feature Store (Silver)"
    description: "Cadastral parcels with standardized zoning categories, Euclidean distances to CBD/stations, and walkshed tiers."
    columns:
      - name: parcel_id
        type: string
        description: "Mecklenburg County Parcel Identifier (PID)."
        examples: ["00101101", "00123456"]
      - name: nc_pin
        type: string
        description: "North Carolina permanent PIN."
        examples: ["00101101"]
      - name: shape_area_sqft
        type: number
        description: "Cadastral land area in square feet."
        examples: [19594.48, 34699.51]
      - name: calc_acreage
        type: number
        description: "Calculated acreage (shape_area_sqft / 43,560)."
        examples: [0.4498, 0.7966]
      - name: zoning_category
        type: string
        description: "Harmonized land-use zoning category."
        values: ["TOD", "SFR", "MFR", "OTHER_COMMERCIAL"]
      - name: dist_to_cbd_ft
        type: number
        description: "Euclidean distance to Charlotte CBD (Trade & Tryon) in US Survey Feet."
        examples: [92083.2, 94210.5]
      - name: nearest_station_id
        type: string
        description: "Station UID of the nearest transit platform."
        examples: ["Red Line_RL_CORNELIUS", "Red Line_RL_DAVIDSON"]
      - name: nearest_station_name
        type: string
        description: "Name of the nearest transit platform."
        examples: ["Cornelius Town Center Station", "Davidson Main & Griffith Station"]
      - name: nearest_line
        type: string
        description: "Corridor line of the nearest station platform."
        examples: ["Red Line", "BLE", "BL", "Control_Matthews"]
      - name: nearest_is_planned
        type: boolean
        description: "Whether the nearest station is planned or currently active."
        examples: [true, false]
      - name: dist_to_station_ft
        type: number
        description: "Euclidean distance to nearest platform in US Survey Feet."
        examples: [4820.5, 1250.0]
      - name: dist_to_station_meters
        type: number
        description: "Euclidean distance to nearest platform in meters (dist_to_station_ft * 0.3048)."
        examples: [1469.3, 381.0]
      - name: transit_buffer_tier
        type: string
        description: "Transit catchment classification."
        values:
          - "QUARTER_MILE_WALK"
          - "HALF_MILE_WALK"
          - "ONE_MILE_ACCESS"
          - "OUTSIDE_WALKSHED"
      - name: processed_timestamp
        type: datetime
        description: "Timestamp when feature transformation ran."
        range: ["2024-01-01T00:00:00Z", "2027-12-31T23:59:59Z"]

  - name: silver.cpi_deflator
    label: "BLS CPI Inflation Deflator Index (Silver)"
    description: "Bureau of Labor Statistics annual CPI-U averages used to adjust nominal transaction prices to real 2026 purchasing power."
    columns:
      - name: sale_year
        type: integer
        description: "Calendar year of property transaction."
        range: [2000, 2026]
      - name: cpi_index
        type: number
        description: "Annual BLS CPI-U index value (Base Year = 2026, 333.300)."
        examples: [270.970, 333.300]

  - name: silver.sales_standardized
    label: "Standardized Real Estate Transactions (Silver)"
    description: "Historical arm's-length sales deflated to real 2026 dollars with calculated real price per square foot (PPSF)."
    columns:
      - name: sale_id
        type: string
        description: "Unique deed transaction identifier."
        examples: ["SALE_00101101"]
      - name: parcel_id
        type: string
        description: "Foreign key referencing silver.parcels_spatial.parcel_id."
        examples: ["00101101"]
      - name: sale_date
        type: date
        description: "Closing or deed recording date."
        range: ["2000-01-01", "2026-12-31"]
      - name: sale_year
        type: integer
        description: "Calendar year of sale."
        range: [2000, 2026]
      - name: nominal_price
        type: number
        description: "Recorded nominal sales price in USD."
        examples: [450000.0]
      - name: real_price_2026
        type: number
        description: "Sale price standardized to 2026 purchasing power using BLS CPI-U index."
        examples: [553511.46]
      - name: shape_area_sqft
        type: number
        description: "Parcel cadastral footprint area in square feet."
        examples: [19594.48]
      - name: ppsf_real_2026
        type: number
        description: "Real 2026 price per square foot of land area (real_price_2026 / shape_area_sqft)."
        examples: [28.25, 15.95]
      - name: qualified_sale_flag
        type: string
        description: "Arm's-length transaction flag screening transfers < $10,000."
        examples: ["Y"]
      - name: processed_timestamp
        type: datetime
        description: "Timestamp when standardization completed."
        range: ["2024-01-01T00:00:00Z", "2027-12-31T23:59:59Z"]

  # =========================================================================
  # GOLD LAYER (Analytical Views & Econometric Modeling)
  # =========================================================================
  - name: gold.hedonic_sample
    label: "Econometric Modeling Sample (Gold)"
    description: >-
      Denormalized modeling view combining arms-length real deed transactions with 
      spatial accessibility covariates, zoning fixed effects, and policy era indicators.
    columns:
      - name: sale_id
        type: string
        description: "Deed transaction primary key."
      - name: parcel_id
        type: string
        description: "Cadastral parcel identifier."
      - name: sale_year
        type: integer
        description: "Calendar year of transaction (2012–2026)."
      - name: log_real_price
        type: number
        description: "Natural log of total real sales price (LN(real_price_2026))."
      - name: log_real_ppsf
        type: number
        description: "Natural log of real price per square foot of land area (LN(ppsf_real_2026)). Primary regression regressand."
      - name: real_price_2026
        type: number
        description: "Deflated real transaction price in 2026 dollars."
      - name: nominal_price
        type: number
        description: "Raw nominal consideration recorded on deed."
      - name: ppsf_real_2026
        type: number
        description: "Real price per square foot of land area."
      - name: shape_area_sqft
        type: number
        description: "Parcel footprint area in square feet."
      - name: calc_acreage
        type: number
        description: "Calculated parcel acreage."
      - name: dist_to_cbd_miles
        type: number
        description: "Distance to Charlotte CBD (Trade & Tryon) in statute miles (dist_to_cbd_ft / 5,280)."
      - name: dist_station_km
        type: number
        description: "Distance to nearest rail station platform in kilometers (dist_to_station_meters / 1,000)."
      - name: nearest_line
        type: string
        description: "Nearest transit corridor (BLE, BL, Red Line, Control_Matthews)."
      - name: nearest_station_name
        type: string
        description: "Name of the nearest station platform. Used as the clustering unit for standard errors."
      - name: zoning_category
        type: string
        description: "Categorical zoning classification (SFR reference, MFR, OTHER_COMMERCIAL, TOD)."
      - name: in_walkshed
        type: integer
        description: "Binary pedestrian indicator (1 if dist_to_station_ft <= 2640, else 0)."
      - name: is_blue_line
        type: integer
        description: "Binary indicator for Blue Line (BL) or Blue Line Extension (BLE) parcels."
      - name: is_control_corridor
        type: integer
        description: "Binary indicator for unbuilt Matthews / Silver Line counterfactual corridor."
      - name: is_red_line
        type: integer
        description: "Binary indicator for planned Red Line commuter rail corridor."
      - name: era_pre_construction
        type: integer
        description: "Binary policy era dummy: Sale occurred before FTA FFGA funding (Year < 2014)."
      - name: era_anticipation
        type: integer
        description: "Binary policy era dummy: Sale occurred during funding and active construction (2014 <= Year <= 2017)."
      - name: era_revenue_service
        type: integer
        description: "Binary policy era dummy: Sale occurred during revenue service operations (Year >= 2018)."

  - name: gold.transaction_velocity
    label: "Market Liquidity & Turnover Panel (Gold)"
    description: >-
      Balanced stratum-year panel tracking annual transaction volume against total parcel inventory
      to evaluate market liquidity, turnover surges, and land banking assembly behavior.
    columns:
      - name: nearest_line
        type: string
        description: "Corridor service designation."
      - name: in_walkshed
        type: integer
        description: "Pedestrian walkshed boundary indicator (1 if <= 0.5 mi, 0 otherwise)."
      - name: zoning_category
        type: string
        description: "Harmonized land-use zoning category."
      - name: sale_year
        type: integer
        description: "Calendar transaction year (2012–2026)."
      - name: tx_count
        type: integer
        description: "Total deed transactions recorded within the stratum-year cell. Zero-filled via Cartesian grid."
      - name: total_parcels
        type: integer
        description: "Total parcel inventory stock in the spatial stratum (denominator for turnover rate and Poisson offset)."
      - name: turnover_rate_pct
        type: number
        description: "Annual turnover percentage per 100 parcels ((tx_count / total_parcels) * 100)."
      - name: median_real_ppsf
        type: number
        description: "Median real PPSF of transactions in cell (NULL for zero-transaction years)."
      - name: mean_real_ppsf
        type: number
        description: "Mean real PPSF of transactions in cell (NULL for zero-transaction years)."
      - name: policy_era
        type: string
        description: "Categorical transit lifecycle era: Pre-Grant Baseline, Anticipation / Construction, or Revenue Service."
